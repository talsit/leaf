<script>
// loading screen: skyline silhouette, fake-but-honest progress bar, then the mode buttons once the game module says it's ready
(() => {
	let svg = '', x = 0, seed = 7;
	const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
	while (x < 1000) {
		const w = 25 + rnd() * 55, h = 40 + rnd() * 150;
		svg += `<rect x="${x.toFixed(1)}" y="${(200 - h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="#0a0014" stroke="#b01cff" stroke-width="1.2"/>`;
		for (let wy = 200 - h + 8; wy < 195; wy += 12) for (let wx = x + 5; wx < x + w - 6; wx += 9) if (rnd() < 0.22) svg += `<rect x="${wx.toFixed(1)}" y="${wy.toFixed(1)}" width="3" height="5" fill="${rnd() < 0.5 ? '#ffe600' : '#00f0ff'}"/>`;
		x += w + rnd() * 6;
	}
	document.getElementById('loadCity').innerHTML = svg;
	const fill = document.getElementById('loadFill'), status = document.getElementById('loadStatus'), modes = document.getElementById('loadModes');
	let p = 0, ready = false;
	const tick = setInterval(() => { if (!ready) { p += (0.9 - p) * 0.06; fill.style.width = (p * 100).toFixed(1) + '%'; } }, 60);
	const fail = setTimeout(() => { if (!ready) { status.textContent = 'NO SIGNAL — CHECK YOUR INTERNET'; status.style.color = '#ff2a55'; } }, 20000);
	window.__loaderReady = () => {
		ready = true; clearInterval(tick); clearTimeout(fail);
		fill.style.width = '100%';
		setTimeout(() => { fill.parentElement.hidden = true; status.textContent = 'SELECT MODE'; modes.hidden = false; }, 350);
	};
	modes.addEventListener('click', e => { const b = e.target.closest('button'); if (b && window.__startMode) window.__startMode(b.dataset.mode); });
})();
</script>

<script type="module">

		low: [90, 220], tall: [220, 400], lowP: 0.4, maxTier: 470, setback: [25, 60], antenna: [30, 70], maxSpire: 520, crown: [25, 55],

MODES.bizarro = { ...MODES.normal, name: 'BIZARRO', cast: 'bizarro' };

                            // collision uses the same mirrored footprint whichever way it faces

const NEON = ['#ff2bd6', '#00f0ff', '#9d4dff', '#a6ff00', '#ff8a00', '#ffe600', '#ff2a55', '#2d7bff'];

const TYPES = {
	normal: { w: 1,   L: 26, lum: 0.85, pts: 100, pen: 150, neon: N_CYAN },
	fat:    { w: 2,   L: 26, lum: 0.85, pts: 150, pen: 150, neon: N_ORANGE },
	vip:    { w: 1,   L: 26, lum: 1.0,  pts: 500, pen: 500, neon: N_YELLOW },
	kid:    { w: 0.5, L: 18, lum: 0.85, pts: 120, pen: 200, neon: N_LIME },
	dog:    { w: 0.5, L: 22, lum: 0.9,  pts: 200, pen: 200, neon: N_PINK, say: 'WOOF!', thanks: 'GOOD DOG!' },   // hangs on by its mouth
	// bizarro
	dino:    { w: 2,   L: 30, lum: 0.9,  pts: 300, pen: 300, neon: N_LIME,   say: 'ROAR!',  thanks: 'RAWR-SOME!' },
	dragon:  { w: 1.5, L: 28, lum: 0.9,  pts: 250, pen: 250, neon: N_RED,    say: 'RAWR!',  thanks: 'DRAGON SAVED!' },
	unicorn: { w: 1,   L: 28, lum: 1.0,  pts: 400, pen: 400, neon: N_PINK,   say: 'NEIGH!', thanks: 'MAGICAL!' },
	// puppy patrol
	cat:     { w: 0.5, L: 20, lum: 0.9,  pts: 200, pen: 0,   neon: N_ORANGE, say: 'MEOW!',  thanks: 'PURRFECT!' },
	bunny:   { w: 0.5, L: 20, lum: 0.9,  pts: 200, pen: 0,   neon: N_CYAN,   say: 'EEP!',   thanks: 'HOPPY!' },
	pig:     { w: 1.5, L: 22, lum: 0.9,  pts: 250, pen: 0,   neon: N_PINK,   say: 'OINK!',  thanks: 'OINKTASTIC!' },

// who's on the rooftops in each cast
function pickCast(q) {

	if (M.cast === 'animals') return q < 0.6 ? 'dog' : q < 0.74 ? 'cat' : q < 0.88 ? 'bunny' : 'pig';

// ---------- seeded rng ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- line / fill builders (game uses y-down; three uses y-up, so y is negated here) ----------
class Sink {
	constructor() { this.i = 1; this.z = 0; this.h = N_PINK; } // i = brightness, h = neon colour index under the searchlight
	seg(x1, y1, x2, y2) { const r = lin(TINT[0] * this.i), g = lin(TINT[1] * this.i), b = lin(TINT[2] * this.i); this.v(x1, -y1, this.z, r, g, b, this.h); this.v(x2, -y2, this.z, r, g, b, this.h); }
	path(pts, closed) { for (let k = 0; k < pts.length - 1; k++) this.seg(pts[k][0], pts[k][1], pts[k + 1][0], pts[k + 1][1]); if (closed) { const a = pts[pts.length - 1]; this.seg(a[0], a[1], pts[0][0], pts[0][1]); } }

	ellipse(cx, cy, rx, ry, rot = 0, n = 16) {
		const c = Math.cos(rot), s = Math.sin(rot), p = [];

	constructor(max) {

// ---------- three setup ----------
const glCanvas = document.getElementById('gl'), hud = document.getElementById('hud'), hx = hud.getContext('2d');

// lines turn their neon colour, building faces pick up a dark synthwave purple.

function buildScene() {
	for (const g of [levelGroup, farGroup, starGroup, moonGroup]) if (g) { scene.remove(g); g.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
	levelGroup = new THREE.Group(); farGroup = new THREE.Group(); starGroup = new THREE.Group(); moonGroup = new THREE.Group();

	let lines = new StaticSink(), fill = new Fill();
	// ground + road
	fill.rect(-3000, GROUND, L.worldW + 6000, 3000, -2);
	lines.h = N_PURPLE; lines.i = 0.45; lines.seg(-3000, GROUND, L.worldW + 3000, GROUND);
	lines.h = N_YELLOW; lines.i = 0.18; for (let x = -3000; x < L.worldW + 3000; x += 32) lines.seg(x, GROUND + 18, x + 14, GROUND + 18);
	// the city is built in chunks of a few buildings so three can frustum-cull what's off screen
	const flush = () => { if (lines.p.length) levelGroup.add(fill.build(0x06080b), lines.build()); lines = new StaticSink(); fill = new Fill(); };
	flush();
	L.buildings.forEach((b, bi) => {
		if (bi % 6 === 0) flush();
		for (const t of b.tiers) fill.rect(t.x, t.y, t.w, t.h, -2);
		lines.i = b.hospital ? 1 : 0.6; lines.h = b.hospital ? N_RED : (b.seed & 1 ? N_PINK : N_BLUE);
		for (const t of b.tiers) lines.rect(t.x, t.y, t.w, t.h);
		lines.h = N_LIME;
		if (b.antenna) {
			const a = b.antenna; lines.seg(a.x, a.base, a.x, a.top);
			for (let y = a.base - 12; y > a.top + 8; y -= 14) lines.seg(a.x - 3, y, a.x + 3, y);
		}
		if (b.crown) {
			const c = b.crown; fill.tri(c.ax, c.ay, c.cx, c.cy, c.bx, c.by, -2);
			lines.seg(c.ax, c.ay, c.cx, c.cy); lines.seg(c.cx, c.cy, c.bx, c.by); lines.seg(c.cx, c.cy, c.cx, c.cy - 16);
		}
		// windows
		b.tiers.forEach((t, ti) => {
			const cols = Math.floor((t.w - 8) / 11), rows = Math.floor((t.h - 12) / 15), ox = t.x + (t.w - cols * 11) / 2 + 3;
			for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
				const wx = ox + c * 11, wy = t.y + 8 + r * 15;
				if (wy + 10 > GROUND || (b.hospital && c > cols * 0.25 && c < cols * 0.75 && r < 6)) continue;
				const lit = hash(b.seed, r + ti * 97, c) < b.lit;
				lines.i = lit ? 0.5 : 0.1; lines.h = lit ? (b.seed & 2 ? N_CYAN : N_YELLOW) : N_PURPLE;
				lines.rect(wx, wy, 5, 8);
			}
		});
		if (b.hospital) {
			const hs = L.hosps.find(h => h.b === b), t = b.tiers[0], cx = t.x + t.w / 2, cy = t.y + 62;
			lines.i = 1; lines.h = N_RED;
			lines.path([[cx - 6, cy - 22], [cx + 6, cy - 22], [cx + 6, cy - 6], [cx + 22, cy - 6], [cx + 22, cy + 6], [cx + 6, cy + 6], [cx + 6, cy + 22],
				[cx - 6, cy + 22], [cx - 6, cy + 6], [cx - 22, cy + 6], [cx - 22, cy - 6], [cx - 6, cy - 6]], true);
			lines.i = 0.8; lines.h = N_CYAN; lines.ellipse(hs.padX, hs.roofY - 1, 50, 4, 0, 24);
			const s = hs.stair; fill.rect(s.x, s.y, s.w, s.h, -2); lines.i = 1; lines.rect(s.x, s.y, s.w, s.h);
			lines.i = 0.6; lines.rect(s.x + 3, s.y + 6, 9, 16);
		}
	});
	flush();

	// far skyline: rects run far below the ground so parallax never shows their bottoms
	const fl = new StaticSink(), ff = new Fill(); fl.i = 0.13; fl.z = -20;
	for (const b of L.far) { ff.rect(b.x, GROUND - b.h, b.w, b.h + 2500, -21); fl.rect(b.x, GROUND - b.h, b.w, b.h + 2500); }
	farGroup.add(ff.build(0x040507, false), fl.build(plainLineMat));

	const sg = new THREE.BufferGeometry(), sp = [];
	for (let i = 0; i < L.stars.length; i += 2) sp.push(L.stars[i], -L.stars[i + 1], -30);
	sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
	starGroup.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0x9aa4ad, size: 1.6 * DPR, sizeAttenuation: false })));

	const ml = new StaticSink(); ml.z = -25;
	ml.i = 0.9; ml.circle(0, 0, 26, 40);
	ml.i = 0.35; ml.circle(-8, -6, 5, 12); ml.circle(9, 8, 3, 10); ml.circle(6, -11, 2, 8);
	moonGroup.add(ml.build(plainLineMat));
	scene.add(levelGroup, farGroup, starGroup, moonGroup);
}

function heliCollide(depth = 0) {

	for (const s of L.shapes) {
		if (s.t === 'tri') {
			for (const [bx, by, bw, bh] of boxes) for (const [px, py] of [[bx, by + bh], [bx + bw, by + bh], [bx + bw / 2, by + bh], [bx, by], [bx + bw, by]])

			continue;
		}
		for (const [bx, by, bw, bh] of boxes) {
			const ox = Math.min(bx + bw, s.x1) - Math.max(bx, s.x0), oyy = Math.min(by + bh, s.y1) - Math.max(by, s.y0);

				else { heli.y += oyy; impact = -heli.vy; heli.vy = Math.max(0, heli.vy); }
			} else {
				if (bx + bw / 2 < s.x0 + s.w / 2) { heli.x -= ox; impact = heli.vx; heli.vx = Math.min(0, heli.vx); }
				else { heli.x += ox; impact = -heli.vx; heli.vx = Math.max(0, heli.vx); }

		if (s.t === 'r') return crash('ROTOR STRIKE!');

// ---------- fx ----------

		if (heli.hold <= 0) heli.vy += (iy * maxV * 0.85 + 50 * ld / CAP - heli.vy) * Math.min(1, 2.6 * dt);
		if (ix) heli.face = ix;

			});

	}

	for (const p of L.people) if (TYPES[p.type].say && p.state === 'wait' && Math.abs(p.fx - heli.x) < 260 && Math.abs(p.fy - heli.y) < 260 && Math.random() < dt * 0.5) sfx.voice(p.type);

}

		c.fillStyle = HUDC(lit ? 1 : 0.35);
		c.save(); c.translate(ox + Math.cos(a) * R * 0.78, oy + Math.sin(a) * R * 0.78); c.rotate(a);
		c.beginPath(); c.moveTo(R * 0.14, 0); c.lineTo(-R * 0.06, -R * 0.1); c.lineTo(-R * 0.06, R * 0.1); c.closePath(); c.fill(); c.restore();
	}
	const kx = active ? ox + (joy.x - joy.ox) * DPR : ox, ky = active ? oy + (joy.y - joy.oy) * DPR : oy;
	c.fillStyle = HUDC(active ? 0.35 : 0.15); c.beginPath(); c.arc(kx, ky, R * 0.42, 0, TAU); c.fill(); c.stroke();
	if (!active) { c.globalAlpha = 0.5; c.fillStyle = HUDC(1); c.font = `${u * 0.7}px sans-serif`; c.textAlign = 'center'; c.fillText('thumb anywhere & slide', ox, oy - R - u * 0.6); }
	c.restore();
}

// ---------- minimap: whole city, waiting people, hospital, heli and the current view ----------
let miniCache = null;
function drawMinimap(c, u) {
	const mw = Math.round(Math.min(W - 2 * u, u * 70)), mh = Math.round(u * 3.4), mx = Math.round((W - mw) / 2), my = Math.round(u * 3.6);
	const yTop = CEIL - 30, yBot = GROUND + 8;
	const fx = x => mx + x / L.worldW * mw, fy = y => my + (y - yTop) / (yBot - yTop) * mh;
	const key = [mw, mh, L.seed, mode].join();
	if (!miniCache || miniCache.key !== key) {
		const cv = document.createElement('canvas'); cv.width = mw; cv.height = mh;
		const g = cv.getContext('2d');
		g.fillStyle = 'rgba(3,4,5,.8)'; g.fillRect(0, 0, mw, mh);
		for (const b of L.buildings) {
			g.fillStyle = HUDC(b.hospital ? 0.55 : 0.16);
			for (const t of b.tiers) g.fillRect(fx(t.x) - mx, fy(t.y) - my, Math.max(1, t.w / L.worldW * mw), fy(GROUND) - fy(t.y));
			g.fillStyle = HUDC(0.35);
			if (b.antenna) g.fillRect(fx(b.antenna.x) - mx, fy(b.antenna.top) - my, 1, fy(b.antenna.base) - fy(b.antenna.top));
			if (b.crown) { g.beginPath(); g.moveTo(fx(b.crown.ax) - mx, fy(b.crown.ay) - my); g.lineTo(fx(b.crown.cx) - mx, fy(b.crown.cy) - my); g.lineTo(fx(b.crown.bx) - mx, fy(b.crown.by) - my); g.fill(); }
		}
		g.strokeStyle = HUDC(1); g.lineWidth = Math.max(2, u * 0.18); g.beginPath();
		for (const hs of L.hosps) { const cx = fx(hs.padX) - mx, cy = fy(hs.roofY) - my - u * 0.9, a = u * 0.5; g.moveTo(cx - a, cy); g.lineTo(cx + a, cy); g.moveTo(cx, cy - a); g.lineTo(cx, cy + a); }
		g.stroke();
		g.strokeStyle = HUDC(0.35); g.lineWidth = 1; g.strokeRect(0.5, 0.5, mw - 1, mh - 1);
		miniCache = { key, cv };
	}
	c.drawImage(miniCache.cv, mx, my);
	c.save(); c.beginPath(); c.rect(mx, my, mw, mh); c.clip();
	// waiting people (VIPs bigger)
	const d = Math.max(2, Math.round(u * 0.16));
	c.fillStyle = HUDC(0.95);
	for (const p of L.people) {
		if (p.state !== 'wait') continue;
		const s = p.type === 'vip' ? d * 1.8 : d;
		c.fillRect(fx(p.fx) - s / 2, fy(p.fy) - s, s, s);
	}
	// current view + heli (and a line down to the end of its chain)
	c.strokeStyle = HUDC(0.45); c.lineWidth = 1;
	c.strokeRect(fx(camX - vw / 2), fy(camY - vh / 2), vw / L.worldW * mw, vh / (yBot - yTop) * mh);
	if (!heli.dead || Math.sin(time * 20) > 0) {
		const hx2 = fx(heli.x), hy2 = fy(heli.y), r = d * 2.2;
		c.fillStyle = HUDC(1); c.beginPath(); c.moveTo(hx2 - r, hy2 - r * 0.6); c.lineTo(hx2 + r, hy2 - r * 0.6); c.lineTo(hx2, hy2 + r * 0.8); c.closePath(); c.fill();
		if (hc.persons.length) { const e = hc.pts[hc.pts.length - 1]; c.strokeStyle = HUDC(0.8); c.beginPath(); c.moveTo(hx2, hy2); c.lineTo(fx(e.x), fy(e.y)); c.stroke(); }
	}
	c.restore();
}

// ---------- loop ----------
startLevel(1);
let last = performance.now(), acc = 0;
function frame(now) {
	acc += Math.min(0.05, (now - last) / 1000); last = now;
	while (acc >= STEP) { update(STEP); acc -= STEP; }
	render();
	requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__loaderReady && window.__loaderReady();
</script>
</body>
